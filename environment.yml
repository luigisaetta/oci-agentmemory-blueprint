name: oci-agentmemory-blueprint

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pip:
      # Runtime dependencies
      - oci
      - oracledb
      - oracleagentmemory==26.6.0
      - python-dotenv
      - fastapi
      - uvicorn[standard]
      - langchain-oci==0.3.1
      # Development and quality tools
      - pytest
      - pytest-cov
      - black
      - pylint
